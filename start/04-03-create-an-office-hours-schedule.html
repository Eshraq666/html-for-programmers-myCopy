<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create An Office Hours Schedule</title>
</head>

<body>
  <table>
      <tr>
        <th scope="col"></th>
        <th scope="col">Monday</th>
        <th scope="col">Tuesday</th>
        <th scope="col">Wednesday</th>
        <th scope="col">Thursday</th>
        <th scope="col">Friday</th>
      </tr>
    
      <tr>
        <th scope="row">9:00 - 11:00</th>
        <td>open</td>
        <td>closed</td>
        <td>open</td>
        <td>closed</td>
        <td>open</td>
      </tr>
      <tr>
        <th scope="row">11:00 - 12:00</th>
        <td>closed</td>
        <td>open</td>
        <td>closed</td>
        <td>open</td>
        <td>open</td>
      </tr>
      <tr>
        <th scope="row">12:00 - 14:00</th>
        <td>open</td>
        <td>closed</td>
        <td>open</td>
        <td>closed</td>
        <td>open</td>
      </tr>
      <tr>
        <th scope="row">14:00 - 16:00</th>
        <td>open</td>
        <td>open</td>
        <td>open</td>
        <td>open</td>
        <td>closed</td>
      </tr>
      <tr>
        <th scope="row">16:00 - 18:00</th>
        <td>closed</td>
        <td>open</td>
        <td>closed</td>
        <td>open</td>
        <td>closed</td>
      </tr>
  </table>
</body>

</html>
